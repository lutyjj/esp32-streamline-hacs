version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: mainline
    schedule:
      interval: weekly
    groups:
      development:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: mainline
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: mainline
    schedule:
      interval: weekly
