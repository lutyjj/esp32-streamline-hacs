name: Release

# Publishes the draft release that Release Please created at the tag. Order is
# what makes an interrupted run safe to redispatch at the same tag: resolve the
# release commit from the draft, verify the tagged tree carries the tag's
# version, publish the draft as the release, then validate the published
# release with HACS. Reruns converge — an already-published release is left
# untouched.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      latest: ${{ steps.release-state.outputs.latest }}
    steps:
      # A draft release holds only the intended tag name — GitHub creates the
      # tag ref when the release is published. The release record stores the
      # exact commit in both states, so read it from there and require a full
      # SHA rather than risking a branch-name checkout.
      - name: Resolve the release commit
        id: commit
        run: |
          sha="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$'
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Verify the tagged tree carries the tag's version
        run: make version-check VERSION="${TAG#v}"

      # A release older than the published latest must not steal the `latest`
      # marker.
      - name: Decide whether this tag becomes latest
        id: release-state
        run: |
          current="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          latest=false
          if [ "$(printf '%s\n%s\n' "$current" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then latest=true; fi
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"

      # The commit point: publishing the draft creates the tag ref and locks the
      # release. A rerun that finds the release already published leaves it
      # untouched.
      - name: Publish the release
        env:
          LATEST: ${{ steps.release-state.outputs.latest }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest="$LATEST"
          else
            echo "release $TAG is already published"
          fi

  validate-release:
    name: Validate published HACS release
    needs: publish
    if: ${{ needs.publish.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate the published release with HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
