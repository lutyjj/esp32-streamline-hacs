name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare mainline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out mainline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: mainline
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm the version is available
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be a stable X.Y.Z value."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::v$VERSION already exists."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release v$VERSION already exists."
            exit 1
          fi

      - name: Prepare release metadata
        run: make release-prepare VERSION="$VERSION"

      - name: Commit directly to mainline
        id: commit
        run: |
          initial_sha=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/streamline/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): release $VERSION"
          fi
          git fetch --quiet origin mainline
          test "$(git rev-parse origin/mainline)" = "$initial_sha" || {
            echo "::error::mainline advanced during release preparation; run the workflow again."
            exit 1
          }
          if test "$(git rev-parse HEAD)" != "$initial_sha"; then
            git push origin HEAD:mainline
          fi
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release commit
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out prepared commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Run the complete release check
        run: make release-check VERSION="$VERSION"

  publish:
    name: Publish GitHub release
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm mainline still points to the verified commit
        run: |
          git fetch --quiet origin mainline
          test "$(git rev-parse origin/mainline)" = "$RELEASE_SHA" || {
            echo "::error::mainline advanced after verification; run the workflow again."
            exit 1
          }

      - name: Render the HACS update announcement
        run: |
          make --no-print-directory release-notes VERSION="$VERSION" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Create the tag and published release
        run: >-
          gh release create "v$VERSION"
          --repo "$GITHUB_REPOSITORY"
          --target "$RELEASE_SHA"
          --title "v$VERSION"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --fail-on-no-commits

  validate-release:
    name: Validate published HACS release
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate the published release with HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
